<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 214" width="340" height="214" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset=".55" stop-color="#ffd43b"/>
      <stop offset="1" stop-color="#f2b705"/>
    </linearGradient>
    <clipPath id="recorte"><rect width="340" height="214" rx="18"/></clipPath>
  </defs>

  <!-- Fondo de la tarjeta -->
  <rect width="340" height="214" rx="18" fill="url(#fondo)"/>
  <g clip-path="url(#recorte)">
    <circle cx="310" cy="10" r="120" fill="#fff" opacity=".13"/>
    <circle cx="40" cy="230" r="90" fill="#fff" opacity=".08"/>
  </g>

  <!-- Logo Meezan Bank (esquina superior izquierda) -->
  <circle cx="40" cy="38" r="14" fill="#0b8a4b"/>
  <path d="M32.4 43.8V32.8L40 40.4L47.6 32.8V43.8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="49.3" cy="28.7" r="2.9" fill="#ffc83d"/>
  <text x="60" y="43" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold" fill="#5b2c9f">Meezan <tspan fill="#0b8a4b">Bank</tspan></text>

  <!-- Tipo de tarjeta -->
  <text x="312" y="43" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2" fill="#3b1a6e" opacity=".85">DEBIT</text>

  <!-- Chip y contactless -->
  <rect x="28" y="82" width="44" height="34" rx="6" fill="#d4af37"/>
  <path d="M28 94h44M28 104h44M46 82v34" stroke="#a8872a" stroke-width="1.5" fill="none"/>
  <g fill="none" stroke="#3b1a6e" stroke-width="2.5" stroke-linecap="round" opacity=".7">
    <path d="M92 90q6 9 0 18"/><path d="M99 85q9 14 0 28"/><path d="M106 80q12 19 0 38"/>
  </g>

  <!-- Datos -->
  <text x="28" y="148" font-family="'Courier New', monospace" font-size="19" font-weight="bold" letter-spacing="1.5" fill="#3b1a6e">4521 8800 1234 5678</text>
  <text x="28" y="186" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="1" fill="#3b1a6e">NOMBRE APELLIDO</text>
  <text x="165" y="186" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#3b1a6e">VÁLIDA 12/30</text>

  <!-- Logo de la red -->
  <text x="312" y="190" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" font-style="italic" fill="#1a1f71">VISA</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
